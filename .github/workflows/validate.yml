name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts examples
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/inspect_jetson.sh scripts/start_llm.sh
